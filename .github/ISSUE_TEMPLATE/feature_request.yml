name: Feature request
description: Suggest something a plugin should be able to do
labels: [enhancement]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - AI Assistant
        - Auto Thumbnails
        - Enhanced PDF Reader
        - Kids Mode
        - Mature Content
        - A new plugin
    validations: {required: true}
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, rather than the solution you have in mind.
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
