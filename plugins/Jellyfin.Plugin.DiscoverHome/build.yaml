overview: "A discovery-style home screen for the Jellyfin web client."
description: >
  Restyles the Jellyfin home screen into something closer to a discovery
  front page: a sidebar pinned open on desktop, a centered search box with
  live suggestions, denser poster cards, and genre and studio carousels
  shuffled in between Jellyfin's own rows on every load. Studio logos are
  fetched once a day from a public artwork repository, and genre tiles are
  backed by a collage of posters already in that genre. Everything is
  presentation only — it reorders and restyles what Jellyfin already
  rendered for a user and never changes what they can see.
