overview: "Fresh posters, backdrops and category images on a schedule, or for one item from its card menu."
description: >
  Refreshes artwork from public sources (TMDb, Fanart.tv, Wikimedia Commons,
  Open Library, Cover Art Archive, TheAudioDB, optional Google Programmable
  Search) on a schedule inside a time window, or for a single item from the
  card menu. Builds mosaics for genres, studios and collections from artwork
  already in the library. Never touches locked items, excluded libraries or book
  covers made by Auto Thumbnails.
