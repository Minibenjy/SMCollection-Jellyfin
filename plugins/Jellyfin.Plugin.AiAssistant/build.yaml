description: >
  Adds a conversational assistant to the Jellyfin web client. Each user
  routes their own AI provider, and the assistant acts strictly inside that
  user's own library permissions: it can search, recommend from real
  metadata, build and edit playlists, and mark things watched, but only ever
  as the person talking to it.
